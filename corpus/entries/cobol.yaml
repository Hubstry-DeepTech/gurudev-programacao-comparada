bloco_4_metafora_fundante:
  definicao: "O código como documento burocrático executável — a estrutura hierárquica em DIVISION, SECTION e PARAGRAPH espelha a organização de relatórios corporativos americanos dos anos 1950."
  explicacao: "COBOL foi deliberadamente projetado para que o código-fonte fosse legível por gerentes não-técnicos. A unidade sintática fundamental não é a função ou a classe, mas o PARAGRAPH — uma divisão textual análoga a parágrafos de memorandos corporativos. As quatro DIVISIONs obrigatórias (IDENTIFICATION, ENVIRONMENT, DATA, PROCEDURE) correspondem às seções de um relatório administrativo: cabeçalho, contexto operacional, definição dos dados manipulados e instruções de execução. Essa homologia não é acidental: o Departamento de Defesa dos EUA exigiu explicitamente que a linguagem fosse compreensível por administradores sem formação em computação. O resultado é que cada programa COBOL lê como um formulário padronizado, e não como um algoritmo. A metáfora fundante opera no nível homológico: a estrutura do código reproduz estruturalmente a estrutura de documentos burocráticos. O custo dessa decisão de design é a verbosidade extrema — o que em linguagens modernas se expressa em uma linha, em COBOL exige dezenas — mas o benefício pretendido era eliminar a intermediarização entre o especificador de negócios e a máquina."
  modo_analogia_tats: "homologica"
  homologia_dominio:
    dominio: "Burocracia corporativa americana do pós-guerra (anos 1950)"
    tipo_analogia: "homologica"
    explicacao: "A homologia é estrutural e profunda: as DIVISIONs de COBOL correspondem a seções de memorandos governamentais; as SECTIONs a subseções temáticas; os PARAGRAPHs a unidades discursivas. Assim como um relatório do Departamento de Defesa tem cabeçalho padronizado (IDENTIFICATION), descrição do contexto operacional (ENVIRONMENT), catálogo de dados referenciados (DATA) e procedimentos a executar (PROCEDURE), um programa COBOL reparte obrigatoriamente seu código nesses quatro blocos. A analogia não é meramente estética — ela reflete uma teoria do que significa 'especificar computação' que é fundamentalmente diferente da teoria que informou linguagens como C ou Lisp: para COBOL, especificar computação é redigir um documento; para C, é instruir uma máquina; para Lisp, é manipular expressões simbólicas."

bloco_5_interface_grammar:
  camada_1_cognitiva:
    modelo_mental_induzido: "Pensamento burocrático-documentário: o programador organiza seu trabalho como quem preenche formulários padronizados, definindo registros, campos e procedimentos em sequência linear, sem abstração reutilizável significativa."
    epistemologia_implicita: "Legibilidade por leigos > expressividade técnica; verbosidade como forma de garantia de corretude; a computação como extensão de processos administrativos já existentes, não como domínio autônomo com lógica própria."
    gradiente_transformacao_cognitiva: 8
  camada_2_infraestrutural:
    distancia_silicio: 4
    modelo_memoria: "Manual explícito via cláusulas WORKING-STORAGE e LINKAGE. Tipos de dados têm layout fixo em memória definido por PIC (PICTURE clauses): PIC 9(5) occupy 5 bytes decimais, PIC X(20) occupy 20 bytes alfanuméricos. COMP e COMP-3 controlam representação binária e packed decimal."
    modelo_concorrencia: "Inexistente no COBOL 85 padrão. COBOL executa como programa sequencial em batch ou transacional (CICS). Concorrência é gerenciada pelo ambiente de execução (CICS, IMS/TM), não pela linguagem. Não há threads, async ou mecanismos de concorrência na linguagem."
  camada_3_sistemica:
    acesso_syscalls: "Indireto via cláusulas ENVIRONMENT DIVISION. ACCEPT e DISPLAY para I/O de console; READ/WRITE para acesso a arquivos sequenciais, indexados e relativos; chamadas a programas externos via CALL. Não há acesso direto a syscalls do SO."
    modelo_io: "I/O fortemente baseado em arquivos: SEQUENTIAL, INDEXED, RELATIVE. Operações: OPEN, READ, WRITE, REWRITE, DELETE, START. SORT e MERGE integrados à linguagem. CICS adiciona I/O transacional para terminais e filas."
    portabilidade: "Teoricamente portável entre plataformas mainframe (IBM z/OS, IBM VSE, Micro Focus, GnuCOBOL). Na prática, dialetos de compiladores (IBM COBOL vs Micro Focus) criam fragmentação significativa. Padrão ANSI minimiza diferenças, mas recursos proprietários são ubíquos."
  camada_4_ecossistemica:
    protocolo_interop: "CALL para subprogramas COBOL/C; CICS LINK para transacional; MQ PUT/GET para mensageria; JSON PARSE/GENERATE para REST (COBOL 2014)."
    filosofia_package_manager: "Inexistente. COBOL não possui sistema de pacotes. Módulos são compartilhados via COPYBOOKS (arquivos de cópia incluídos via diretiva COPY). No mainframe, programas compilados são armazenados em bibliotecas de carga (LOADLIBs). A reutilização é organizacional, não automatizada."
    modelo_governanca: "ANSI/ISO (COBOL 60, 68, 74, 85, 2002, 2014). Dominância de IBM e Micro Focus. GnuCOBOL open-source. Governança fragmentada entre ISO e implementadores."
  camada_5_cultural:
    valores_encodados:
      - "verbosidade como clareza e garantia de corretude"
      - "estrutura hierárquica como ordem"
      - "legibilidade por não-especialistas"
      - "estabilidade e previsibilidade acima de inovação"
      - "compatibilidade retroativa absoluta"
      - "processamento de dados como função social"
    transformacao_programador: "O programador COBOL desenvolve mentalidade de processamento de dados em lote, com foco em registros, campos, layouts de arquivo e relatórios. Tende a pensar em termos de dados (o que manipular) antes que em algoritmos (como manipular). A transição para linguagens modernas exige ruptura cognitiva severa: o programador deve aprender abstração por funções/classes, programação orientada a expressões em vez de declarações, e modelos de memória baseados em referências em vez de layouts fixos. Por outro lado, programadores COBOL desenvolvem disciplina rigorosa na definição de tipos de dados e na validação de formatos, habilidade valorizada em sistemas financeiros."
    comunidade_identidade: "Institucional e corporativa — mantenedores de sistemas legados em instituições financeiras, governos e grandes empresas. Identidade marcada pela permanência e pela responsabilidade sobre sistemas críticos de produção."

bloco_6_analise_savigny:
  gramatical: "Sintaxe verbose baseada em palavras reservadas em inglês natural. Quatro DIVISIONs obrigatórias organizam o programa hierarquicamente: IDENTIFICATION (metadados), ENVIRONMENT (configuração de I/O e ambiente), DATA (definição de tipos de dados via PIC clauses, nível hierárquico 01-88), PROCEDURE (lógica executável em SECTIONs e PARAGRAPHs). Tipos definidos por PICTURE clauses: PIC 9 para numérico, PIC X para alfanumérico, PIC S9V9 para decimal com sinal e casas decimais. Pontuação por pontos finais encerrando instruções. Estrutura fixa de colunas no formato tradicional (1-6: sequência, 7: indicador, 8-11: Area A, 12-72: Area B). COBOL 2002 introduziu formato livre. A linguagem possui sentenças (statements terminadas por ponto) e instruções (verbos individuais). Cláusulas de nível 88 definem valores nomeados (condnames) análogos a enums."
  semantica: "COBOL encoda a teoria de que a computação é, fundamentalmente, processamento de dados comerciais — e que esse processamento deve ser legível, auditável e verificável por não-programadores. Cada decisão de design reflete essa convicção: verbos em inglês (ADD, SUBTRACT, MULTIPLY, DIVIDE) em vez de operadores matemáticos; PIC clauses que descrevem visualmente o formato dos dados; registros hierárquicos que espelham formulários de papel. A linguagem presume que o dado é mais importante que o algoritmo, que a correção é mais importante que a performance, e que a continuidade operacional é mais importante que a elegância técnica. COBOL é, em essência, a materialização de uma epistemologia burocrática da computação: os dados existem primeiro, são classificados e formatados, e depois são processados por regras explícitas e verificáveis."
  historica: "Criado em 1959 pela Conference on Data Systems Languages (CODASYL), sob patrocínio do Departamento de Defesa dos EUA. Grace Hopper, então na Remington Rand, foi a força motriz intelectual, baseando-se em seu trabalho prévio com FLOW-MATIC (1955) e no COMTRAN da IBM. O contexto político era explícito: o DoD gastava fortunas com software incompatível entre ramos militares e contratantes, e exigiu uma linguagem comum, portável e legível. Mary K. Hawes (Burroughs) e Jean E. Sammet (Sylvania Electric) foram fundamentais no design. A primeira especificação (COBOL-60) foi publicada em 1960; revisões significativas seguiram em 1968, 1974, 1985, 2002 e 2014. O COBOL 85 é a versão mais amplamente implantada e considerada o padrão de facto. A decisão de usar sintaxe em inglês foi deliberada e polêmica: acadêmicos de computação consideravam a abordagem amadora, mas o objetivo não era acadêmico — era tornar a linguagem acessível a gerentes de negócios. A permanência de COBOL por mais de 60 anos é um caso exemplar de path dependency institucional: os custos de migração (riscados em bilhões de dólares) e a confiabilidade comprovada de sistemas COBOL em produção criam barreiras econômicas e culturais quase intransponíveis."
  sistematica: "Descendente direto de FLOW-MATIC (Grace Hopper, 1955) e COMTRAN (Bob Bemer, IBM, 1957). Influenciou significativamente PL/I (IBM, 1964), que buscou unificar COBOL e FORTRAN em uma linguagem; RPG (IBM, 1965); e as 4GLs dos anos 1980 (Natural, Focus). Conceitualmente influenciou SQL na noção de processamento declarativo de dados e na separação entre definição de dados (DATA DIVISION ~ DDL) e manipulação (PROCEDURE DIVISION ~ DML). O ecossistema COBOL é dominado por mainframe IBM (z/OS, CICS, IMS, DB2), com presença significativa em plataformas Micro Focus para Linux/Windows. Estima-se que 95% das transações ATM e 80% das transações in-person nos EUA passem por sistemas COBOL (Gartner, 2022). O legado sistêmico é paradoxal: COBOL é simultaneamente a linguagem mais criticada e a mais economicamente crítica da história da computação."

bloco_7_sintatico:
  declaracoes:
    - "IDENTIFICATION DIVISION"
