    - "SELECT ... ASSIGN TO"
    - "FD (File Description)"
    - "01-77 (nível de registro/campo)"
    - "88 (condname — valor nomeado)"
  controle_fluxo:
    - "IF/ELSE/END-IF"
    - "EVALUATE/WHEN/END-EVALUATE (equivalente a switch/case)"
    - "PERFORM ... THRU"
    - "PERFORM ... UNTIL"
    - "PERFORM ... VARYING"
    - "PERFORM ... TIMES"
    - "CALL/END-CALL (invocação de subprograma)"
    - "GO TO (desencorajado mas disponível)"
    - "STOP RUN"
    - "GOBACK"
    - "EXIT PROGRAM"
  expressoes:
    - "ADD ... TO ... GIVING"
    - "SUBTRACT ... FROM ... GIVING"
    - "MULTIPLY ... BY ... GIVING"
    - "DIVIDE ... INTO ... GIVING ... REMAINDER"
    - "COMPUTE (atribuição com expressão aritmética: +, -, *, /, **)"
    - "MOVE (atribuição — o operador fundamental)"
    - "STRING (concatenação)"
    - "UNSTRING (separação)"
    - "INSPECT (contagem e substituição de caracteres)"
    - "INITIALIZE (inicialização de registro)"
  modificadores_acesso:
    - "PUBLIC (COBOL 2002 — para métodos de classe)"
    - "PRIVATE (COBOL 2002)"
    - "PROTECTED (COBOL 2002)"
    - "GLOBAL (variáveis acessíveis entre programas)"
    - "EXTERNAL (variáveis compartilhadas entre run-units)"
  literais:
    - "numeric literal (ex: 42, 3.14, +15, -7)"
    - "alphanumeric literal (ex: 'Hello')"
    - "figurative constant ZERO/ZEROS/ZEROES"
    - "figurative constant SPACE/SPACES"
    - "figurative constant HIGH-VALUES"
    - "figurative constant LOW-VALUES"
    - "figurative constant QUOTE/QUOTES"
    - "figurative constant TRUE/FALSE (COBOL 2002)"
    - "boolean literal TRUE/FALSE (COBOL 2002)"
    - "null-terminated literal (Z'Heterogeneous') (COBOL 2002)"
  padroes_matching:
    - "EVALUATE TRUE/WHEN (pattern matching condicional)"
    - "INSPECT CONVERTING/TALLYING/REPLACING"
    - "STRING/UNSTRING com DELIMITED BY"
  outros:
    - "COPY ... REPLACING (inclusão de copybooks)"
    - "* (comentário de coluna 7)"
    - ">> (comentário em formato livre, COBOL 2002)"
    - "nível hierárquico 01-49, 66 (REDEFINES), 77 (item escalar), 88 (condname)"
    - "Cláusulas: PIC, USAGE, OCCURS, REDEFINES, VALUE, BLANK WHEN ZERO"
    - "88-level (condname) como enum built-in"

