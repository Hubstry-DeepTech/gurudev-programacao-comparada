      - "PROGRAMAS monolíticos com milhares de linhas sem modularização"
      - "HARDCODE de valores que deveriam ser configuráveis (PDBs/PSBs)"
      - "USO excessivo de WORKING-STORAGE sem limpeza (memory leak conceitual)"
      - "PICTURE clauses mal dimensionadas (truncamento de dados)"
    convencoes_comunitarias:
