      - "Caixa alta para palavras reservadas, caixa alta para identificadores"
      - "Nível 01 para registros, nível 05/10 para subcampos, nível 88 para condnames"
      - "COLUMN 72 como limite de linha (formato fixo tradicional)"
      - "Sequência numérica de 6 dígitos nas colunas 1-6 (order)"
      - " separação clara entre COPY (definição de dados) e lógica (PROCEDURE)"

