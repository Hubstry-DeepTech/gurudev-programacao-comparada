bloco_14_semiotico:
  relacao_semiotica_predominante: "simbolica"
  estrutura_triadica:
    signo: "O verbo DISPLAY é o signo central de saída em COBOL. Não há qualquer motivação icônica entre a palavra 'DISPLAY' e o ato de escrever na saída padrão — a relação é puramente convencional, arbitrariamente estabelecida pelo comitê CODASYL e mantida por 60 anos por força de path dependency."
    objeto: "O conceito de 'apresentar dados ao operador ou sistema conectado' — a necessidade de tornar resultados de processamento visíveis. No contexto dos anos 1950, o objeto era um operador de terminal impresso; hoje, pode ser um terminal CICS, uma API REST ou uma mensagem MQ."
    interpretante: "O modelo mental formado no programador de que 'DISPLAY' é o canal canônico de saída — sempre disponível, sempre síncrono, sempre legível. Esse interpretante reforça a metáfora fundante: DISPLAY é como imprimir uma linha em um relatório, não como emitir um evento em um sistema de streaming."
  potencial_ambiguidade_semiotica: 2
