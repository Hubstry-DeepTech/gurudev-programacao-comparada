bloco_10_comparativo:
  similaridades_para:
    fortran:
      - "Ambas são linguagens compiladas da Era 2, nascidas em contexto científico-militar"
      - "Ambas usam formato fixo de colunas (historicamente)"
      - "Ambas priorizam estabilidade e compatibilidade retroativa"
    pl1:
      - "PL/I foi criado pela IBM explicitamente para unificar COBOL e FORTRAN"
      - "Ambas suportam tipos de dados fixed-point e decimal com precisão definida"
      - "Ambas compartilham o modelo de DIVISION/SECTION para organização de código"
    sql:
      - "Ambas tratam dados como entidade central, não algoritmos"
      - "Ambas usam palavras reservadas em inglês natural (SELECT, INSERT, UPDATE)"
      - "Ambas foram projetadas para serem legíveis por não-programadores"
  diferencas_para:
    python:
      - "Metáforas fundantes opostas: documento burocrático (COBOL) vs. prosa executável (Python)"
      - "Epistemologias opostas: verbosidade como garantia (COBOL) vs. legibilidade por concisão (Python)"
      - "Eras históricas distintas: Era 2 (1950-1970) vs. Era 4 (1990-2010)"
      - "COBOL é estático com layout de memória fixo; Python é dinâmico com tipagem por duck typing"
      - "COBOL não possui funções de primeira classe, closures ou list comprehension"
      - "Modelos de memória opostos: PIC clauses com layout fixo vs. objetos e referências"
    java:
      - "Java é orientado a objetos com GC; COBOL é imperativo procedural com gerenciamento manual"
      - "Java usa classes e herança; COBOL usa COPYBOOKS e chamadas a subprogramas"
      - "Java possui sistema de pacotes e imports; COBOL usa cópia textual (COPY) de fragments"
      - "Java possui tratamento de exceções estruturado (try/catch); COBOL 85 usa códigos de retorno (FILE STATUS); tratamento formal apenas no COBOL 2002"
    rust:
      - "Rust prioriza segurança de memória em tempo de compilação via ownership; COBOL assume layouts fixos e gerenciamento manual implícito pelo runtime"
      - "Rust possui algebraic types e pattern matching; COBOL usa 88-level condnames e EVALUATE"
      - "Metáforas fundantes radicalmente opostas: controle espacial de recursos (Rust) vs. documento burocrático (COBOL)"
      - "Rust é moderno (Era 5), com ecossistema ativo; COBOL é legado (Era 2), com ecossistema institucional"
      - "Rust compila para WASM e multiplataforma nativamente; COBOL é historicamente mainframe-centric"
  genealogia_direta:
    - "flow-matic"
    - "comtran"
  influenciou:
    - "pl1"
    - "rpg"
    - "sql"
    - "natural"
    - "focus"
    - "databus"
  familia_linguistica: "Família COBOL / Business Data Processing"

