bloco_14_semiotico:
  relacao_semiotica_predominante: "simbolica"
  estrutura_triadica:
    signo: "A lifetime annotation 'a e o signo semiótico central de Rust. Trata-se de um marcador textual que nao existe em tempo de execucao — e puramente simbolico, arbitrario em relacao ao conceito que representa. Nao ha motivacao iconica (uma aspa seguida de 'a' nao lembra tempo de vida) nem indicial (nao e uma marca deixada pelo dado na memoria)."
    objeto: "O tempo de vida real do dado em memoria — o intervalo entre a alocacao e a desalocacao. A lifetime 'a e o representante formal desse intervalo: quando o compilador resolve 'a, ele esta determinando exatamente quando o dado referenciado sera valido, e recusa compilar caso a referencia possa sobreviver ao dado."
    interpretante: "O modelo mental formado no programador de que toda referencia tem um prazo de validade, e que o compilador e o guardiao desse prazo. O interpretante de 'a e a internalizacao da nocao de que seguranca de memoria e um problema de logica temporal, nao de gerenciamento manual. O programador Rust passa a 'ver' lifetimes implicitos mesmo em linguagens que nao os possuem — uma transformacao cognitiva permanente."
  potencial_ambiguidade_semiotica: 3
