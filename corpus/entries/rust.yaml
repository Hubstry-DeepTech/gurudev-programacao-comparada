    - "*= (assign mul)"
    - "/= (assign div)"
    - "%= (assign rem)"
    - "&= (assign bitand)"
    - "|= (assign bitor)"
    - "^= (assign bitxor)"
    - "<<= (assign shl)"
    - ">>= (assign shr)"
    # ── Tipos ──
    - "-> (tipo de retorno / fat arrow)"
    - "=> (match arm / pattern)"
    - ":: (path separator / turbofish)"
    - ": (type annotation)"
    - "; (statement terminator)"
    - ", (separator)"
    # ── Range ──
    - ".. (range exclusive)"
    - "..= (range inclusive)"
    - "... (spread pattern — deprecated, use ..)"
    # ── Outros ──
    - "# (attribute prefix)"
    - "@ (binding in patterns)"
    - "$ (macro invocation)"
    - "? (error propagation / try operator)"
  context_sensitive_keywords:
    - "dyn (contexto: trait object dinamico — dyn Trait)"
    - "union (contexto: declaracao de union vs. acesso a campo union)"
    - "'static (contexto: lifetime estatico — pode ser string literal ou lifetime)"
