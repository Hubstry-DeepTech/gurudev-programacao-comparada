bloco_4_metafora_fundante:
  definicao: "O codigo como contrato de propriedade espacial — cada dado tem um dono exclusivo, e o compilador funciona como cartorio que registra e fiscaliza todas as transferencias de posse."
  explicacao: |
    A metafora fundante de Rust e a de um sistema juridico de propriedade aplicado a memoria. O conceito de ownership (posse) estabelece que todo dado alocado tem exatamente um dono. Quando esse dono sai de escopo, o dado e desalocado automaticamente — sem GC, sem custo em runtime. O borrow checker e o guardiao semiotico dessa metafora: ele aplica as regras de posse em tempo de compilacao, impedindo aliases mutaveis simultaneos (o que em C causaria data races e em C++ undefined behavior). As referencias emprestadas (borrowing) funcionam como contratos temporarios de uso: o tomador pode ler ou modificar, mas nunca fica com a posse, e o prazo do emprestimo (lifetime) e verificado estaticamente. A ausencia de GC nao e uma limitacao tecnica e uma escolha filosofica: Rust rejeita a metafora do coletor de lixo como um imposto sobre o tempo de execucao que o programador nao pode prever ou controlar. Em vez disso, o custo da liberacao de memoria e pago pelo dono no momento exato em que ele sai de escopo. O contraste com as metasfundantes do corpus e revelador: Python trata o codigo como prosa executavel (legibilidade acima de tudo), COBOL como documento burocratico (verbosidade como garantia), e Rust como contrato de propriedade (seguranca acima de tudo). O programador Rust nao apenas escreve logica — ele registra, em nivel sintatico, quem possui o que, por quanto tempo, e sob quais condicoes a posse pode ser transferida ou compartilhada.
  modo_analogia_tats: "homologica"
  homologia_dominio:
    dominio: "Direito de propriedade e registro de imoveis"
    tipo_analogia: "homologica"
    explicacao: |
      A homologia e estrutural: ownership funciona como titulo de propriedade, borrowing como arrendamento temporario, e lifetimes como prazo de contrato. O borrow checker e o cartorio que verifica, em tempo de compilacao, se todas as transferencias estao registradas e se ninguem esta usando um recurso que ja foi transferido. O sistema de tipos de Rust codifica essa logica juridica: assim como um cartorio imobiliario impede que duas pessoas registrem a mesma escrita, o borrow checker impide que duas referencias mutaveis apontem para o mesmo dado. A similaridade vai alem da metáfora: o sistema de ownership do Rust resolve problemas concretos (data races, use-after-free, dangling pointers) da mesma forma que sistemas juridicos de propriedade resolvem disputas de posse — definindo regras claras, auditáveis e enforceáveis antes que o conflito aconteça.

bloco_5_interface_grammar:
  camada_1_cognitiva:
    modelo_mental_induzido: "Pensamento espacial de recursos: o programador Rust raciociona em termos de posse, escopo de vida e fluxo de dados. Cada operacao e vista como transferencia de propriedade ou emprestimo temporario, exigindo consciencia explicita de onde cada dado vive e quem tem o direito de modifica-lo."
    epistemologia_implicita: "Seguranca em tempo de compilacao e um direito, nao um luxo; a correcao deve ser gratuita em runtime (zero-cost abstractions); o programador e capaz de gerenciar memoria se tiver ferramentas adequadas; conflitos de concorrencia devem ser impossiveis, nao gerenciáveis."
    gradiente_transformacao_cognitiva: 9
  camada_2_infraestrutural:
    distancia_silicio: 2
    modelo_memoria: "Ownership com borrowing e lifetimes. Cada dado tem um dono exclusivo (move semantics). Referencias emprestadas (&T, &mut T) com lifetime annotations. Tipos inteligentes: Rc<T>, Arc<T>, Box<T>, Cell<T>/RefCell<T>, UnsafeCell."
    modelo_concorrencia: "Fearless concurrency: o tipo system garante ausencia de data races via Send + Sync traits. std::thread para threads nativas; Mutex, RwLock, channels (mpsc). async/await com Futures e executores Tokio para concorrencia nao-bloqueante."
  camada_3_sistemica:
    acesso_syscalls: "Direto via módulo std::sys e FFI com unsafe extern. Nao ha sandboxing — codigo unsafe pode chamar qualquer syscall do SO. Bibliotecas como nix e libc fornecem wrappers seguros em cima de chamadas C."
    modelo_io: "Assincrono via trait Future + async/await (executores Tokio, async-std); sincrono via std::fs e std::io. BufReader/BufWriter para bufferização. O Rust formaliza a posse de recursos de I/O via Drop trait — arquivos sao fechados automaticamente quando o owner sai de escopo."
    portabilidade: "Compilador rustc gera binários nativos para Linux, macOS, Windows, WebAssembly, bare-metal (no_std). Cross-compilation via rustup target add.libc independente: musl (Linux), system libc. Ecosssistema tiered de suporte a plataformas (Tier 1-3)."
  camada_4_ecossistemica:
    protocolo_interop: "FFI via extern 'C' com ABI compatível com C. Unsafe bridges para C++, Java (JNI), Python (PyO3), Node.js (napi-rs), Ruby, etc. WASM para interoperabilidade web."
    filosofia_package_manager: "Cargo como ferramenta unificada (build, test, doc, publish). Crates.io como registry central. Dependências com versionamento semver. Workspaces para monorepos. Features para compilação condicional."
    modelo_governanca: "Rust Foundation (AWS, Google, Microsoft, Mozilla, Huawei). RFC process aberto. Core team + library teams + compiler team. Decision making via rfc.rs."
  camada_5_cultural:
    valores_encodados:
      - "segurança de memória como propriedade da linguagem, não do programador"
      - "explicitação de custos em tempo de compilacao (zero-cost abstractions)"
      - "corretude acima de conveniência"
      - "fearless concurrency — concorrencia sem medo"
      - "ergonomia sem sacrificar performance"
      - "inclusão e acessibilidade da comunidade (Code of Conduct enforced)"
      - "transparência governamental (RFCs publicos, decisões rastreáveis)"
    transformacao_programador: "Programar em Rust transforma fundamentalmente a relacao do programador com recursos computacionais. O programador aprende a pensar em termos de posse e fluxo de dados: cada variavel e um recurso que pertence a alguem, e cada operacao implica uma transferencia de propriedade ou um emprestimo temporario com prazo definido. Esse modelo mental contrasta radicalmente com o de Python, onde objetos sao compartilhados livremente por referencia e o programador raramente precisa pensar em quem possui um dado, e com o de COBOL, onde a memoria e gerenciada pelo runtime em layouts fixos e o programador raciocina em termos de registros e campos. O programador Rust desenvolve disciplina rigorosa na separacao entre dados compartilhados e dados exclusivos, na antecipacao de problemas de concorrencia antes que eles ocorram, e na distincao entre seguranca garantida pelo compilador (safe Rust) e seguranca assumida pelo programador (unsafe Rust). A transicao de Python para Rust e uma das rupturas cognitivas mais severas entre linguagens contemporaneas: o programador deve renunciar a conveniencia do GC, aprender a explicitar lifetimes, e aceitar que o compilador recusa codigo que funcionaria em tempo de execucao mas que nao pode ser provado seguro estaticamente. Essa experiencia de ser corrigido pelo compilador e transformadora: o programador passa a confiar que codigo que compila esta livre de categorias inteiras de bugs (data races, use-after-free, null dereference)."
    comunidade_identidade: "Rustaceans — comunidade global com forte cultura de acolhimento, Code of Conduct rigoroso, e enfase na diversidade. Identidade marcada pelo orgulho de usar uma linguagem que nao deixa voce cometer erros de memoria. Cultura de mentorias ativas (RustBridge, Women in Rust)."

bloco_6_analise_savigny:
  gramatical: |
    A gramática de Rust torna explicito o que outras linguagens escondem. O verbo let declara variáveis com posse imediata; let mut marca explicitamente a mutabilidade (imutabilidade e o default). O sistema de tipos codifica ownership na assinatura de funções: T indica posse transferida, &T indica empréstimo imutável, &mut T indica empréstimo mutável. As annotations de lifetime ('a) fazem visível o que em C é gerenciado pelo programador sem auxílio do compilador. Pattern matching (match, if let, while let) e o mecanismo central de controle de fluxo, exigindo exaustividade e fazendo explicitos todos os casos possíveis. Traits definem interfaces e comportamentos compartilhados de forma explícita; impl blocos associam comportamento a tipos. A macro println! demonstra a filosofia zero-cost: o format string e processado em tempo de compilacao, gerando código equivalente ao que um programador C escreveria manualmente com sprintf. Unsafe blocks marcam a fronteira entre codigo que o compilador pode provar seguro e codigo que o programador assume a responsabilidade — uma demarcação gramatical de confiança sem paralelo em outras linguagens.
  semantica: |
    Rust encoda a teoria de que seguranca de memoria e performance nao sao trade-offs inevitaveis. Cada decisao de design semantico reflete essa conviccao: o borrow checker move o custo da verificacao de aliases para o tempo de compilacao; as traits eliminam o custo de dispatch dinamico quando possivel via monomorfizacao; o sistema de ownership elimina o custo de um GC sem transferir a responsabilidade de desalocacao para o programador — o compilador insere drop calls automaticamente nos pontos de saida de escopo. A nocao de "zero-cost abstractions" e o principio semântico central: toda abstracao de alto nivel pode ser eliminada pelo compilador ate gerar codigo equivalente ao que seria escrito manualmente em C. Rust tambem encoda a teoria de que o tempo de vida de dados e mensuravel e representável no sistema de tipos — uma inovacao semantica que nenhuma linguagem anterior havia formalizado completamente. A existencia de unsafe como mecanismo de escape controlado revela que Rust aceita que nem toda seguranca pode ser verificada estaticamente, mas exige que o programador declare explicitamente onde essa verificacao nao se aplica.
  historica: |
    Rust surgiu em 2006 como projeto pessoal de Graydon Hoare na Mozilla Research, motivado pela necessidade de reescrever componentes criticos do Firefox (Gecko) sem os memory bugs cronicos de C++. A proposta era radical: criar uma linguagem de sistemas com seguranca de memoria verificavel estaticamente, sem garbage collector, e com performance comparavel a C. O contexto historico e fundamental: a decada de 2000 foi marcada por uma enxurrada de CVEs de segurança em C/C++ (buffer overflows, use-after-free, double free) que afetavam browsers, sistemas operacionais e infraestrutura critica. O problema nao era falta de habilidade dos programadores — era a incapacidade estrutural de C/C++ de impedir categorias inteiras de erros de memoria. Rust 1.0 foi lançado em maio de 2015, ja com ownership, borrowing, traits, e um ecossistema incipiente em crates.io. A adocao pelo Linux kernel, iniciada com o merge do driver NVMe em Rust em 2022 (Linus Torvalds aprovou pessoalmente), foi o marco de legitimacao definitiva: pela primeira vez, uma linguagem que nao C era aceita no kernel. A Rust Foundation foi criada em 2021 com apoio de AWS, Google, Microsoft, Mozilla e Huawei, consolidando o modelo de governanca independente. A trajetoria de Rust demonstra que e possivel inovar no nivel de linguagens de sistemas com impacto industrial real.
  sistematica: |
    Rust herda influencias de multiplas tradicoes: de C/C++ (desempenho, FFI, modelo de memoria manual), de Haskell (sistema de tipos algébricos, pattern matching, type classes como traits), de ML (inferencia de tipos, algebraic data types), de Cyclone (region-based memory management — influencia direta no conceito de lifetimes), e do Swift (error handling com Result e Optional). A relacao com C e a mais significativa: Rust foi projetado explicitamente como substituto de C/C++ em dominios onde seguranca de memoria e critica (SOs, drivers, browsers, infraestrutura de rede). Com Go, Rust compartilha o nicho de "linguagens de sistemas modernas", mas difere fundamentalmente na estrategia: Go usa GC e simplicidade; Rust usa ownership e explicitacao. Com Swift, compartilha a herança de conceitos de Haskell (optionals, enums com dados), mas diverge no alvo (Swift para Apple ecosystem, Rust para sistemas multiplataforma). Rust influenciou significativamente C++ moderno (conceitos de ownership e borrowing foram propostos para futuras versoes do C++), Swift (actor isolation e Sendable), Kotlin (coroutines e flow), Zig (error handling), e Mojo (ownership system).

