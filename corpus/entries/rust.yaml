    - "|| (OR lógico / lazy)"
    - "! (NOT lógico / bitwise NOT)"
    # ── Bit a bit ──
    - "& (AND bit a bit / borrow)"
    - "| (OR bit a bit)"
    - "^ (XOR bit a bit)"
    - "<< (shift left)"
    - ">> (shift right)"
    # ── Atribuição composta ──
