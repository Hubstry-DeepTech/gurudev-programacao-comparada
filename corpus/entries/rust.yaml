bloco_10_comparativo:
  similaridades_para:
    c:
      - "Ambas compilam para binário nativo com desempenho previsível"
      - "Ambas permitem gerenciamento manual de memória (unsafe em Rust)"
      - "FFI compatível: Rust pode chamar e ser chamada por C via ABI compatível"
      - "Modelo de compilação estática tipado — erros detectados antes do runtime"
    haskell:
      - "Sistema de tipos algébricos com pattern matching exaustivo"
      - "Traits como type classes — polimorfismo paramétrico e ad-hoc"
      - "Inferência de tipos avançada (Hindley-Milner)"
      - "Imutabilidade como default — mutabilidade é marcada explicitamente"
    cpp:
      - "RAII como mecanismo central de gerenciamento de recursos"
      - "Zero-cost abstractions — abstrações de alto nível sem overhead"
      - "Sistemas de tipos fortes com generics e templates/concepts"
      - "Capacidade de programação de baixo nível (unsafe ↔ reinterpret_cast)"
  diferencas_para:
    python:
      - "Rust e estaticamente tipado com posse explicita de dados; Python e dinamicamente tipado com compartilhamento livre por referencia"
      - "Rust move semantic por default — copia de dados e explicita; Python copia referencias e usa GC para liberacao de memoria"
      - "Metaforas fundantes opostas: contrato de propriedade (Rust) vs. prosa executavel (Python)"
      - "Rust trata erros via Result/Option e ? operator (explicito); Python usa exceptions (implicito)"
      - "Rust nao tem null — usa Option<T>; Python usa None com tipagem dinamica"
      - "Rust compila para nativo sem runtime; Python requer interpretador e runtime extenso"
    cobol:
      - "Rust prioriza seguranca de memoria verificada em compilacao; COBOL prioriza legibilidade por gerentes nao-tecnicos"
      - "Metaforas opostas: contrato de propriedade espacial (Rust) vs. documento burocratico executavel (COBOL)"
      - "Rust possui sistema de tipos algébricos, generics, traits; COBOL possui PIC clauses e 88-level condnames"
      - "Rust tem concorrencia nativa segura (fearless concurrency); COBOL delega concorrencia ao ambiente (CICS)"
      - "Rust tem ecossistema ativo em crates.io; COBOL depende de middleware mainframe (CICS, IMS, DB2)"
      - "Eras opostas: Rust e Era 5 (2010-2020); COBOL e Era 2 (1950-1970)"
    c:
      - "Rust garante seguranca de memoria em compilacao; C delega toda responsabilidade ao programador"
      - "Rust proibe aliases mutaveis simultaneos; C permite livremente (causa data races)"
      - "Rust usa ownership + borrowing em vez de malloc/free manual"
      - "Rust tem pattern matching exaustivo; C usa switch/case sem exigencia de exaustividade"
      - "Rust tem Result<T,E> e Option<T> como parte da stdlib; C usa codigos de retorno e NULL"
      - "Rust incorpora conceitos de programação funcional (closures, iterators, traits); C e puramente imperativo"
  genealogia_direta:
