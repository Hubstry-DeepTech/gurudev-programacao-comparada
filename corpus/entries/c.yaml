    - "intmax_t, uintmax_t (maiores tipos inteiros — C99)"
    - "VLA — arrays de tamanho variavel (C99, opcional C11)"
    - "bit fields — campos com largura em bits: unsigned flag : 1"
    - "struct padding — alinhamento automatico dependente de plataforma"

bloco_10_comparativo:
  similaridades_para:
    rust:
      - "Ambas compilam para binario nativo com desempenho previsivel"
      - "Mesmo distancia_silicio proximo (C=1, Rust=2) — ambas sao linguagens de sistemas"
      - "FFI via C ABI: Rust chama e e chamada por C nativamente"
      - "Ambas permitem controle manual de memoria (unsafe em Rust, padrao em C)"
    cpp:
      - "C e praticamente um subconjunto de C++ em sintaxe"
      - "Mesmo modelo de memoria: malloc/free, stack, heap, ponteiros"
      - "C ABI compativel: C pode chamar C++ via extern 'C'"
      - "Compartilham paradigma imperativo e compilacao estatica"
    assembly:
      - "Correspondencia estrutural direta com instrucoes de maquina"
      - "O programador C raciocina em termos de registradores e enderecos"
      - "Aritmetica de ponteiros equivale a aritmetica de enderecos"
  diferencas_para:
    python:
      - "C e estaticamente tipado com gerenciamento manual de memoria; Python e dinamicamente tipado com GC automatico"
      - "C exige explicitacao de tipos e tamanhos; Python infere tudo em runtime"
      - "C tem ponteiros e aritmetica de enderecos; Python abstrai memoria completamente"
      - "Metaforas opostas: conversa direta com a maquina (C) vs. prosa executavel (Python)"
      - "C compila para nativo sem runtime; Python requer interpretador e runtime extenso"
      - "C permite undefined behavior que o programador deve evitar; Python lanca excecoes automaticamente"
    cobol:
      - "C expoe o hardware para controle maximo; COBOL abstrai o hardware para legibilidade"
      - "Metaforas opostas: conversa direta com a maquina (C) vs. documento burocratico (COBOL)"
      - "C e minimalista (32 keywords); COBOL e verboso (~400 palavras reservadas)"
      - "C valoriza performance e controle; COBOL valoriza legibilidade por nao-tecnicos"
      - "C usa ponteiros e malloc/free; COBOL usa layouts de registro e PIC clauses"
      - "C tem tipagem fraca com casts implicitos; COBOL tem tipagem forte com formatos fixos"
      - "A mesma era (Era 2/3) produziu filosofias radicalmente opostas"
    rust:
      - "C delega toda seguranca ao programador; Rust a garante em compilacao"
      - "C permite aliases mutaveis simultaneos livremente (causa data races); Rust proibe"
      - "C tem undefined behavior documentado mas nao enforceado; Rust elimina categorias de UB"
      - "C nao tem sistema de ownership; Rust formaliza posse e emprestimo no tipo"
      - "C usa malloc/free manual (responsabilidade total); Rust usa ownership + borrow checker"
      - "C nao tem Result/Option — usa codigos de retorno e NULL; Rust formaliza tratamento de erros"
      - "C tem ponteiros brutos com qualquer operacao; Rust separa seguras (&T, &mut T) de inseguras (*const T, *mut T)"
      - "A relacao C-Rust e a mais importante do corpus: C e o ancestral cujos problemas motivaram Rust"
  genealogia_direta:
