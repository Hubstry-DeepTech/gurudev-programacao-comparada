    - "= (atribuicao simples)"
    - "+= (assign add)"
    - "-= (assign sub)"
    - "*= (assign mul)"
    - "/= (assign div)"
    - "%= (assign rem)"
    - "&= (assign bitand)"
    - "|= (assign bitor)"
    - "^= (assign bitxor)"
    - "<<= (assign shl)"
    - ">>= (assign shr)"
    # ── Ponteiro e acesso ──
    - "* (dereference — acessa conteudo do endereco)"
    - "& (address-of — captura endereco da variavel)"
    - "-> (arrow — acesso via ponteiro para struct)"
    - ". (dot — acesso direto em struct)"
    - "[] (index — acesso a elemento de array)"
    # ── Outros ──
    - "?: (ternario — condicao ? verdadeiro : falso)"
    - ", (comma — sequenciacao de expressoes)"
    - "sizeof (tamanho em bytes — avaliado em compilacao)"
    - "_Alignof (alinhamento em bytes — C11)"
    - "(type) (cast — conversao explicita de tipo)"
    - "++ (increment — prefix ou posfix)"
    - "-- (decrement — prefix ou posfix)"
  context_sensitive_keywords:
    - "inline (C99 — comportamento varia por linkage e otimizador)"
    - "restrict (C99 — hint de nao-aliasing para otimizador)"
    - "static (tres contextos: variavel local, variavel de arquivo, array)"
    - "extern (declaracao vs. definicao — linkage externo)"
    - "register (historico — sugestao ignorada pela maioria dos compiladores)"
    - "_Generic (C11 — selecao por tipo, requer lista de associacoes)"
  literal_tokens:
    # ── Prefixos de inteiro ──
