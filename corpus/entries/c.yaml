    - "unsigned short / int / long / long long"
    - "float (IEEE 754 single — pelo menos 6 digitos)"
    - "double (IEEE 754 double — pelo menos 10 digitos)"
    - "long double (extended precision — plataforma-dependente)"
    - "_Bool (booleano — 0 ou 1 — C99)"
    - "void (tipo incompleto — sem valor, sem tamanho)"
  referencia_ponteiros:
    - "T* (ponteiro para T — endereco de um T)"
    - "T** (ponteiro para ponteiro — array de ponteiros, etc.)"
    - "void* (ponteiro generico — qualquer tipo, sem tipagem)"
    - "const T* (ponteiro para T imutavel — dados read-only)"
    - "T* const (ponteiro imutavel — endereco fixo, dados mutaveis)"
    - "const T* const (ponteiro e dados imutaveis)"
    - "T[] (array — decai para T* em expressoes, exceto sizeof)"
    - "T(*)(params) (ponteiro de funcao — endereco de codigo)"
    - "NULL ((void*)0 ou 0 — ponteiro nulo)"
  genericos_templates:
    - "_Generic (C11 — selecao por tipo em tempo de compilacao)"
    - "void* como polimorfismo manual — cast para tipo concreto"
    - "macros como templates manuais (#define MAX(a,b) ((a)>(b)?(a):(b)))"
    - "X-macros para geracao de codigo em compilacao"
  tipo_ausencia_nulo:
    - "NULL (macro — geralmente (void*)0 ou inteiro 0)"
    - "Desreferenciar NULL e undefined behavior"
    - "Idioma: verificar ptr != NULL antes de acessar"
  tipo_vazio_never:
    - "void (tipo incompleto — sem valores, sem tamanho, nao declaravel)"
    - "funcoes void: nao retornam valor utilizavel"
    - "void*: ponteiro generico — size_t bytes, tipo desconhecido"
    - "C nao possui tipo never/exhaustive — divergencia por return; ou exit()"
  tipos_algebricos:
    - "struct (produto tipado — campos nomeados em sequencia)"
    - "union (soma sem tag — memória sobreposta, um campo por vez)"
    - "enum (inteiros nomeados — sem dados associados, sem tag automatica)"
    - "struct + function pointers = ad-hoc OOP manual"
    - "tagged union (struct com enum + union) = variante tipada manual"
  outros:
    - "size_t (unsigned — tamanho de objetos, stddef.h)"
    - "ptrdiff_t (signed — diferenca entre ponteiros)"
    - "intptr_t / uintptr_t (inteiros que cabem ponteiros — stdint.h)"
