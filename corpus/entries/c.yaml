    idioms_canonicos:
      - "malloc/free em pares simetricos — cada malloc tem seu free, sem excecao"
      - "NULL check imediato apos malloc — if (ptr == NULL) { handle_error(); }"
      - "typedef struct para encapsulamento sem OOP — opacidade via ponteiros"
      - "ponteiros de funcao para polimorfismo manual — arrays de funcoes"
      - "#ifndef HEADER_H / #define HEADER_H / #endif (include guards)"
