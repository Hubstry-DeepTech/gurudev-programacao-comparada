bloco_14_semiotico:
  relacao_semiotica_predominante: "indicial"
  estrutura_triadica:
    signo: "O operador * (dereference) e o signo semiotico central de C. Diferente da lifetime annotation de Rust (puramente simbolica) e da PICTURE clause de COBOL (iconica), * e predominantemente indicial: ele estabelece uma conexao fisica entre o signo e o objeto. *ptr nao representa o dado — ele acessa o endereco real onde os bytes residem. A relacao e de contingencia fisica: o ponteiro aponta para um lugar concreto na memoria."
    objeto: "O dado real armazenado no endereco de memoria apontado pelo ponteiro. Quando o programador escreve *ptr, o objeto e o conteudo bruto daquele endereco — nao uma copia abstrata, nao uma representacao, mas os proprios bytes na memoria com seus bits e alinhamento tal como existem fisicamente no hardware. Essa materialidade do objeto distingue C de qualquer linguagem de alto nivel."
    interpretante: "O modelo mental do programador de que toda variavel tem um endereco e que * e a operacao de ir ate la. O programador C desenvolve intuicao espacial da memoria: visualiza enderecos, offsets e deslocamentos. Esse interpretante e permanente — o programador C raciocina em enderecos mesmo em linguagens de alto nivel. A alta ambiguidade semiotica (potencial 8) reflete o fato de que * tambem significa multiplicacao e & significa bitwise AND."
  potencial_ambiguidade_semiotica: 8
