      - "size_t para tamanhos e contadores — nunca int para indices de array"
      - "const correctness — const em parametros que nao devem ser modificados"
      - "RAII manual: goto cleanup; para liberacao condicional de recursos"
      - "designated initializers (C99) para clareza: .field = value"
    anti_padroes_comuns:
      - "buffer overflow — escrita alem do limite do array, causa classica de CVEs"
      - "use-after-free — acesso a memoria ja liberada (dangling pointer)"
      - "double free — liberar a mesma memoria duas vezes (corrupcao de heap)"
      - "gets() — funcao removida do C11 por inseguranca intrinseca (sem verificacao de tamanho)"
      - "NULL dereference — acessar *ptr sem verificar ptr != NULL antes"
      - "memory leak — alocar com malloc e esquecer de liberar com free"
      - "integer overflow — operacoes aritmeticas que excedem o limite do tipo"
      - "undefined behavior — confiar no comportamento observado como garantia"
    convencoes_comunitarias:
      - "snake_case para funcoes e variaveis (Linux kernel coding style)"
      - "UPPER_SNAKE_CASE para macros e constantes #define"
      - "prefixo de modulo: libfoo_function_name() (convensao UNIX)"
      - "typedefs PascalCase para tipos opacos: typedef struct Foo Foo;"
      - "header guards: #ifndef FOO_H / #define FOO_H / #endif"
      - "um arquivo .h por modulo com declaracoes, um .c com definicoes"
      - "indentacao por tabs (Linux kernel) ou espacos (GNU style)"
      - "/** Doxygen */ para documentacao de API"

