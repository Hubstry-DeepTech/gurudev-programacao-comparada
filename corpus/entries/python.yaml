  estrutura_triadica:
    signo: "A keyword 'def' e o sinal formal que inicia uma definicao de funcao. E arbitrario em relacao ao conceito que representa (nao ha motivacao iconica ou indireta)."
    objeto: "O conceito de 'definicao de procedimento abstraido' - a capacidade de nomear e reutilizar um bloco de computacao."
    interpretante: "O modelo mental formado no programador de que funcoes sao cidadãos de primeira classe e que a definicao cria um objeto chamavel no namespace."
  potencial_ambiguidade_semiotica: 4
