bloco_4_metafora_fundante:
  definicao: "O codigo como prosa executavel"
  explicacao: "Python foi projetado para que o codigo se aproxime da linguagem natural - legivel por nao-programadores, estruturado pela indentacao visivel, com nomes longos e descritivos. A metafora fundante e a da escrita clara: o codigo deve ser lido antes de ser executado."
  modo_analogia_tats: "heuristica"
  homologia_dominio:
    dominio: "Escrita cientifica e tecnica"
    tipo_analogia: "funcional"
    explicacao: "Assim como um artigo cientifico bem escrito deve ser compreensivel para qualquer leitor da area sem ambiguidades desnecessarias, o codigo Python deve ser compreensivel para qualquer programador sem comentarios excessivos. A funcao de comunicacao precede a funcao de execucao."

bloco_5_interface_grammar:
  camada_1_cognitiva:
    modelo_mental_induzido: "Pensamento iterativo-declarativo: o programador descreve o que quer, nao como a maquina deve faze-lo"
    epistemologia_implicita: "Legibilidade > performance; abstracao > controle; produtividade do programador > eficiencia da maquina"
    gradiente_transformacao_cognitiva: 3
  camada_2_infraestrutural:
    distancia_silicio: 8
    modelo_memoria: "GC por contagem de referencias (CPython) com ciclo de coleta para referencias circulares"
    modelo_concorrencia: "GIL (Global Interpreter Lock) na implementacao CPython; async/await para I/O concorrente; multiprocessing para paralelismo real"
  camada_3_sistemica:
    acesso_syscalls: "Direto via modulo os e ctypes; abstrado pelo runtime"
    modelo_io: "Sincrono bloqueante (padrao); assincrono via asyncio (event-loop)"
    portabilidade: "Write once run anywhere (com CPython disponivel na plataforma)"
  camada_4_ecossistemica:
    protocolo_interop: "FFI via ctypes/cffi; C extension API; WebAssembly (emergente)"
    filosofia_package_manager: "Descentralizado (PyPI) com tolerancia a namespaces"
    modelo_governanca: "Comunidade aberta (PEP process + Core Developers + Steering Council)"
  camada_5_cultural:
    valores_encodados:
      - "legibilidade"
      - "produtividade"
      - "baterias incluidas"
      - "um jeito obvio de fazer cada coisa"
      - "comunidade aberta"
    transformacao_programador: "O programador Python desenvolve intuicao pela expressividade e pela composicao de abstracoes de alto nivel. Tende a subestimar custos computacionais e a superestimar a generalidade de solucoes legiveis. A transicao para linguagens de sistemas (C, Rust) exige ruptura cognitiva significativa."
    comunidade_identidade: "Pragmatismo cientifico com ethos de acessibilidade"

bloco_6_analise_savigny:
  gramatical: "Indentacao significativa; 35 keywords; tipagem dinamica com anotacoes opcionais (PEP 484); sintaxe inspirada em ABC e Modula-3."
  semantica: "Python encoda a teoria de que o custo do programador e mais importante que o custo da maquina. Cada decisao de design - GC, tipagem dinamica, indentacao obrigatoria - e uma aposta de que a legibilidade e a produtividade compensam os custos de runtime."
  historica: "Criado por Guido van Rossum no CWI (Amsterdam) como sucessor do ABC. Lancado em 1991 em um contexto de proliferacao de linguagens de script e de crescente demanda por linguagens mais legiveis que Perl e C. A decisao de usar indentacao significativa foi herdada do ABC e inicialmente controversa."
  sistematica: "Descendente direto de ABC; influenciado por Modula-3, Lisp e C. Influenciou Ruby, CoffeeScript e Julia. Domina ciencia de dados, ML e automacao. Ecossistema PyPI com mais de 500.000 pacotes (2026)."

